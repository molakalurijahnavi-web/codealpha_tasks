<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flashcard Quiz App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <h1>🧠 Flashcard Quiz</h1>
        <p>Learn, practice and test yourself.</p>
    </header>


    <!-- FLASHCARD -->

    <section class="quiz-section">

        <div class="flashcard" id="flashcard">

            <div class="card-content">

                <span id="card-label">QUESTION</span>

                <h2 id="question">Loading...</h2>

                <p id="answer"></p>

            </div>

        </div>


        <button
            id="show-answer"
            class="primary-btn"
            onclick="toggleAnswer()">

            👀 Show Answer

        </button>


        <!-- NAVIGATION -->

        <div class="navigation">

            <button onclick="previousCard()">
                ⬅ Previous
            </button>

            <span id="counter">
                Card 1 of 1
            </span>

            <button onclick="nextCard()">
                Next ➡
            </button>

        </div>


        <!-- PROGRESS -->

        <div class="progress-container">

            <div
                class="progress-bar"
                id="progress-bar">
            </div>

        </div>

    </section>


    <!-- ADD FLASHCARD -->

    <section class="panel">

        <h2>➕ Add Flashcard</h2>

        <input
            type="text"
            id="question-input"
            placeholder="Enter your question">

        <textarea
            id="answer-input"
            placeholder="Enter the answer">
        </textarea>

        <button
            class="primary-btn full-btn"
            onclick="addCard()">

            Add Flashcard

        </button>

    </section>


    <!-- EDIT FLASHCARD -->

    <section class="panel">

        <h2>✏️ Edit Current Flashcard</h2>

        <input
            type="text"
            id="edit-question"
            placeholder="Edit question">

        <textarea
            id="edit-answer"
            placeholder="Edit answer">
        </textarea>

        <button
            class="primary-btn full-btn"
            onclick="saveEdit()">

            💾 Save Changes

        </button>

    </section>


    <!-- DELETE -->

    <section class="manage-section">

        <button
            class="delete-btn"
            onclick="deleteCard()">

            🗑 Delete Current Flashcard

        </button>

    </section>


    <!-- ALL FLASHCARDS -->

    <section class="panel">

        <h2>📚 My Flashcards</h2>

        <div id="cards-list"></div>

    </section>


    <footer>
        <p>Flashcard Quiz • CodeAlpha Task 1</p>
    </footer>

</div>


<script src="script.js"></script>

</body>
</html>
